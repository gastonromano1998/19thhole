<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>19th Hole — Marketplace de palos de golf usados</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap');
  * { font-family: 'Work Sans', sans-serif; }
  body { margin: 0; }
</style>
</head>
<body>

<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState } = React;

// ---------------------------------------------------------------------------
// Iconos (SVG livianos, mismo estilo que lucide, sin dependencias externas)
// ---------------------------------------------------------------------------
function Icon({ paths, size = 18, color = "currentColor", strokeWidth = 2 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color}
      strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round">
      {paths}
    </svg>
  );
}
const Search = (p) => <Icon {...p} paths={<><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></>} />;
const SlidersHorizontal = (p) => <Icon {...p} paths={<><line x1="21" y1="4" x2="14" y2="4" /><line x1="10" y1="4" x2="3" y2="4" /><line x1="21" y1="12" x2="12" y2="12" /><line x1="8" y1="12" x2="3" y2="12" /><line x1="21" y1="20" x2="16" y2="20" /><line x1="12" y1="20" x2="3" y2="20" /><line x1="14" y1="2" x2="14" y2="6" /><line x1="8" y1="10" x2="8" y2="14" /><line x1="16" y1="18" x2="16" y2="22" /></>} />;
const MapPin = (p) => <Icon {...p} paths={<><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" /><circle cx="12" cy="10" r="3" /></>} />;
const ChevronLeft = (p) => <Icon {...p} paths={<polyline points="15 18 9 12 15 6" />} />;
const ChevronRight = (p) => <Icon {...p} paths={<polyline points="9 18 15 12 9 6" />} />;
const Camera = (p) => <Icon {...p} paths={<><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" /><circle cx="12" cy="13" r="4" /></>} />;
const Plus = (p) => <Icon {...p} paths={<><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></>} />;
const MessageCircle = (p) => <Icon {...p} paths={<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />} />;
const User = (p) => <Icon {...p} paths={<><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></>} />;
const Star = (p) => <Icon {...p} fill={p.fill} paths={<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />} />;
const ShieldCheck = (p) => <Icon {...p} paths={<><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /><polyline points="9 12 11 14 15 10" /></>} />;

// ---------------------------------------------------------------------------
// Catálogo: categorías de palos
// ---------------------------------------------------------------------------
const CATEGORIES = [
  { id: "Driver", label: "Drivers" },
  { id: "Madera", label: "Maderas" },
  { id: "Híbrido", label: "Híbridos" },
  { id: "Hierros", label: "Hierros" },
  { id: "Wedge", label: "Wedges" },
  { id: "Putter", label: "Putters" },
];

const ZONES = [
  "Capital Federal",
  "GBA Norte",
  "GBA Sur",
  "GBA Oeste",
  "Córdoba",
  "Santa Fe",
  "Mendoza",
  "Salta",
];

// ---------------------------------------------------------------------------
// Datos de ejemplo (catálogo)
// ---------------------------------------------------------------------------
const LISTINGS = [
  { id: 1, brand: "Callaway", model: "Rogue ST Max", type: "Driver", hand: "Diestro", flex: "Regular", loft: "10.5°", condition: "Usado – muy bueno", price: 145000, zone: "San Isidro", region: "GBA Norte", seller: "Martín P.", rating: 4.8, verified: true, accent: "fairway" },
  { id: 2, brand: "Titleist", model: "T100 (set 4-PW)", type: "Hierros", hand: "Diestro", flex: "Stiff", loft: "Set completo", condition: "Usado – bueno", price: 380000, zone: "Pilar", region: "GBA Norte", seller: "Coti G.", rating: 5.0, verified: true, accent: "sand" },
  { id: 3, brand: "Scotty Cameron", model: "Newport 2", type: "Putter", hand: "Diestro", flex: "—", loft: "34 in", condition: "Usado – como nuevo", price: 210000, zone: "Nordelta", region: "GBA Norte", seller: "Fede A.", rating: 4.6, verified: false, accent: "flag" },
  { id: 4, brand: "Ping", model: "G430", type: "Híbrido", hand: "Zurdo", flex: "Regular", loft: "19°", condition: "Usado – aceptable", price: 95000, zone: "Córdoba Capital", region: "Córdoba", seller: "Sole R.", rating: 4.2, verified: true, accent: "fairway" },
  { id: 5, brand: "TaylorMade", model: "Stealth 2 (set 5-PW)", type: "Hierros", hand: "Diestro", flex: "Regular", loft: "Set completo", condition: "Usado – muy bueno", price: 340000, zone: "Palermo", region: "Capital Federal", seller: "Julián T.", rating: 4.7, verified: true, accent: "sand" },
  { id: 6, brand: "Callaway", model: "Rogue Fairway 3W", type: "Madera", hand: "Diestro", flex: "Stiff", loft: "15°", condition: "Usado – bueno", price: 88000, zone: "Belgrano", region: "Capital Federal", seller: "Ana L.", rating: 4.9, verified: true, accent: "fairway" },
  { id: 7, brand: "Cleveland", model: "RTX ZipCore 56°", type: "Wedge", hand: "Diestro", flex: "Wedge", loft: "56°", condition: "Usado – bueno", price: 62000, zone: "Caballito", region: "Capital Federal", seller: "Nico D.", rating: 4.5, verified: false, accent: "flag" },
  { id: 8, brand: "Titleist", model: "TSR2", type: "Driver", hand: "Zurdo", flex: "Stiff", loft: "9.5°", condition: "Usado – como nuevo", price: 175000, zone: "Morón", region: "GBA Oeste", seller: "Ramiro V.", rating: 4.6, verified: true, accent: "fairway" },
  { id: 9, brand: "Ping", model: "G430 Hierros (set 5-PW)", type: "Hierros", hand: "Diestro", flex: "Regular", loft: "Set completo", condition: "Usado – bueno", price: 310000, zone: "Quilmes", region: "GBA Sur", seller: "Marina S.", rating: 4.3, verified: true, accent: "sand" },
  { id: 10, brand: "Odyssey", model: "White Hot OG #7", type: "Putter", hand: "Diestro", flex: "—", loft: "35 in", condition: "Usado – muy bueno", price: 130000, zone: "Rosario", region: "Santa Fe", seller: "Lucas M.", rating: 4.8, verified: true, accent: "flag" },
  { id: 11, brand: "TaylorMade", model: "Stealth 2 Rescue", type: "Híbrido", hand: "Diestro", flex: "Regular", loft: "22°", condition: "Usado – aceptable", price: 78000, zone: "Ciudad de Mendoza", region: "Mendoza", seller: "Pilar F.", rating: 4.1, verified: false, accent: "fairway" },
  { id: 12, brand: "Callaway", model: "Mack Daddy CB 60°", type: "Wedge", hand: "Diestro", flex: "Wedge", loft: "60°", condition: "Usado – bueno", price: 58000, zone: "Salta Capital", region: "Salta", seller: "Diego H.", rating: 4.4, verified: false, accent: "sand" },
];

const ACCENTS = {
  fairway: { bg: "#2F6B44", tag: "#EAF2EA" },
  sand: { bg: "#B58A3F", tag: "#F6EEDD" },
  flag: { bg: "#B23A24", tag: "#F7E9E4" },
};

const money = (n) => `$${n.toLocaleString("es-AR")}`;

// ---------------------------------------------------------------------------
// Piezas reutilizables
// ---------------------------------------------------------------------------
function SpecTag({ listing }) {
  const c = ACCENTS[listing.accent];
  return (
    <div className="absolute -right-2 -top-2 rotate-6 select-none" style={{ filter: "drop-shadow(0 2px 3px rgba(0,0,0,0.25))" }}>
      <div className="relative px-2.5 py-1 text-[10px] leading-tight" style={{ background: c.bg, color: c.tag, fontFamily: "'Space Mono', monospace", clipPath: "polygon(0 0, 100% 0, 100% 100%, 12px 100%, 0 60%)" }}>
        <div className="absolute rounded-full" style={{ width: 5, height: 5, top: 6, left: 6, background: "rgba(255,255,255,0.55)" }} />
        <div className="pl-3 uppercase tracking-wide">{listing.hand}</div>
        <div className="pl-3 uppercase tracking-wide">{listing.flex}</div>
      </div>
    </div>
  );
}

function ClubGlyph({ type, accent }) {
  const c = ACCENTS[accent];
  return (
    <div className="relative w-full h-28 flex items-center justify-center overflow-hidden" style={{ background: "#F0EEE4" }}>
      <svg width="120" height="90" viewBox="0 0 120 90" fill="none">
        <line x1="20" y1="10" x2="70" y2="80" stroke="#8B8574" strokeWidth="3" strokeLinecap="round" />
        {type === "Putter" ? (
          <rect x="58" y="72" width="26" height="10" rx="2" fill={c.bg} />
        ) : type === "Hierros" ? (
          <path d="M62 68 L92 78 L86 88 L58 82 Z" fill={c.bg} />
        ) : (
          <ellipse cx="82" cy="76" rx="20" ry="13" fill={c.bg} />
        )}
        <circle cx="20" cy="10" r="4" fill="#8B8574" />
      </svg>
      <span className="absolute bottom-1.5 left-2 text-[10px] uppercase tracking-widest" style={{ color: "#8B8574", fontFamily: "'Space Mono', monospace" }}>{type}</span>
    </div>
  );
}

function StatusBar() {
  return (
    <div className="flex items-center justify-between px-5 pt-2 pb-1 text-[11px] font-medium text-white/90">
      <span>9:41</span>
      <div className="flex items-center gap-1"><span>●●●</span><span>Wi-Fi</span><span>100%</span></div>
    </div>
  );
}

function TopBar({ title, onBack }) {
  return (
    <div className="px-4 pt-1 pb-3 flex items-center gap-2" style={{ background: "#16321F" }}>
      {onBack && <button onClick={onBack} className="p-1 -ml-1 text-white/80"><ChevronLeft size={20} /></button>}
      <h1 className="text-white text-[19px]" style={{ fontFamily: "'Fraunces', serif", fontWeight: 600 }}>{title}</h1>
    </div>
  );
}

function BottomNav({ tab, setTab }) {
  const items = [
    { id: "buscar", label: "Buscar", icon: Search },
    { id: "publicar", label: "Publicar", icon: Plus },
    { id: "chats", label: "Chats", icon: MessageCircle },
    { id: "perfil", label: "Perfil", icon: User },
  ];
  return (
    <div className="flex items-stretch border-t" style={{ background: "#FCFBF6", borderColor: "#E4E1D4" }}>
      {items.map((it) => {
        const IconComp = it.icon;
        const active = tab === it.id;
        return (
          <button key={it.id} onClick={() => setTab(it.id)} className="flex-1 flex flex-col items-center gap-0.5 py-2">
            <IconComp size={19} strokeWidth={active ? 2.4 : 1.8} color={active ? "#16321F" : "#9B9885"} />
            <span className="text-[10px]" style={{ fontFamily: "'Space Mono', monospace", color: active ? "#16321F" : "#9B9885" }}>{it.label}</span>
          </button>
        );
      })}
    </div>
  );
}

// ---------------------------------------------------------------------------
// Pantallas
// ---------------------------------------------------------------------------
function ZonePicker({ zone, setZone, open, setOpen }) {
  return (
    <div className="relative">
      <button onClick={() => setOpen(!open)} className="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs whitespace-nowrap" style={{ fontFamily: "'Space Mono', monospace", background: "rgba(255,255,255,0.14)", color: "#F5F6EF" }}>
        <MapPin size={12} />
        {zone === "Todo el país" ? "Todo el país" : zone}
      </button>
      {open && (
        <div className="absolute z-10 mt-1 left-0 rounded-lg overflow-hidden w-48" style={{ background: "#FCFBF6", border: "1px solid #E4E1D4", boxShadow: "0 6px 16px rgba(0,0,0,0.18)" }}>
          {["Todo el país", ...ZONES].map((z) => (
            <button key={z} onClick={() => { setZone(z); setOpen(false); }} className="w-full text-left px-3 py-2 text-[12px]" style={{ color: z === zone ? "#16321F" : "#454A40", fontWeight: z === zone ? 600 : 400, background: z === zone ? "#F0EEE4" : "transparent" }}>
              {z}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function BuscarScreen({ onOpen }) {
  const [filter, setFilter] = useState("Todos");
  const [zone, setZone] = useState("Capital Federal");
  const [zoneOpen, setZoneOpen] = useState(false);
  const filters = ["Todos", "Driver", "Madera", "Híbrido", "Hierros", "Wedge", "Putter"];

  const byCategory = filter === "Todos" ? LISTINGS : LISTINGS.filter((l) => l.type === filter);
  const filtered = zone === "Todo el país" ? byCategory : byCategory.filter((l) => l.region === zone);

  return (
    <>
      <TopBar title="19th Hole" />
      <div className="px-4 pt-1 pb-2 flex items-center justify-between" style={{ background: "#16321F" }}>
        <span className="text-[11px]" style={{ color: "#B7C4B8", fontFamily: "'Space Mono', monospace" }}>Mostrando resultados en</span>
        <ZonePicker zone={zone} setZone={setZone} open={zoneOpen} setOpen={setZoneOpen} />
      </div>
      <div className="px-4 pt-2 pb-3" style={{ background: "#16321F" }}>
        <div className="flex items-center gap-2 rounded-full px-3 py-2" style={{ background: "rgba(255,255,255,0.12)" }}>
          <Search size={16} color="#DDE6DD" />
          <input placeholder="Buscar marca, modelo..." className="bg-transparent outline-none text-sm flex-1 placeholder-white/50 text-white" readOnly />
          <SlidersHorizontal size={16} color="#DDE6DD" />
        </div>
      </div>

      <div className="flex gap-2 px-4 py-3 overflow-x-auto" style={{ background: "#F5F6EF" }}>
        {filters.map((f) => (
          <button key={f} onClick={() => setFilter(f)} className="px-3 py-1.5 rounded-full text-xs whitespace-nowrap border" style={{ fontFamily: "'Space Mono', monospace", background: filter === f ? "#16321F" : "transparent", color: filter === f ? "#F5F6EF" : "#454A40", borderColor: filter === f ? "#16321F" : "#CFCBB8" }}>
            {f}
          </button>
        ))}
      </div>

      {filtered.length === 0 && (
        <div className="mx-4 mb-3 rounded-lg px-3 py-3 text-[12px]" style={{ background: "#FCFBF6", border: "1px dashed #CFCBB8", color: "#5C594C" }}>
          No hay publicaciones de este tipo en <b>{zone}</b> todavía.
          <button onClick={() => setZone("Todo el país")} className="block mt-1 underline" style={{ color: "#16321F", fontFamily: "'Space Mono', monospace" }}>
            Ver en todo el país
          </button>
        </div>
      )}

      <div className="flex-1 overflow-y-auto px-4 pb-3 grid grid-cols-2 gap-3 content-start" style={{ background: "#F5F6EF" }}>
        {filtered.map((l) => (
          <button key={l.id} onClick={() => onOpen(l)} className="text-left rounded-xl overflow-hidden bg-white relative" style={{ border: "1px solid #E4E1D4", boxShadow: "0 1px 2px rgba(0,0,0,0.04)" }}>
            <ClubGlyph type={l.type} accent={l.accent} />
            <SpecTag listing={l} />
            <div className="p-2.5">
              <div className="text-[10px] uppercase tracking-wide" style={{ color: "#8B8574", fontFamily: "'Space Mono', monospace" }}>{l.brand}</div>
              <div className="text-[13px] leading-snug mb-1" style={{ fontFamily: "'Fraunces', serif", fontWeight: 600, color: "#1C2321" }}>{l.model}</div>
              <div className="text-[14px] mb-1" style={{ fontFamily: "'Fraunces', serif", fontWeight: 600, color: "#16321F" }}>{money(l.price)}</div>
              <div className="flex items-center gap-1 text-[10px]" style={{ color: "#8B8574" }}><MapPin size={10} />{l.zone}</div>
            </div>
          </button>
        ))}
      </div>
    </>
  );
}

function DetalleScreen({ listing, onBack }) {
  const specs = [
    ["Marca", listing.brand], ["Modelo", listing.model], ["Tipo", listing.type],
    ["Mano", listing.hand], ["Flex", listing.flex], ["Loft", listing.loft], ["Estado", listing.condition],
  ];
  return (
    <>
      <TopBar title="Publicación" onBack={onBack} />
      <div className="flex-1 overflow-y-auto" style={{ background: "#F5F6EF" }}>
        <div className="relative">
          <ClubGlyph type={listing.type} accent={listing.accent} />
          <div className="h-40" />
          <div className="absolute inset-0 -mt-24" style={{ background: "linear-gradient(180deg, rgba(240,238,228,0) 0%, rgba(245,246,239,1) 70%)" }} />
        </div>
        <div className="px-4 -mt-14 relative">
          <div className="text-[11px] uppercase tracking-wide" style={{ color: "#8B8574", fontFamily: "'Space Mono', monospace" }}>{listing.brand}</div>
          <div className="text-[22px] leading-tight" style={{ fontFamily: "'Fraunces', serif", fontWeight: 600, color: "#1C2321" }}>{listing.model}</div>
          <div className="text-[24px] mt-1 mb-3" style={{ fontFamily: "'Fraunces', serif", fontWeight: 700, color: "#16321F" }}>{money(listing.price)}</div>

          <div className="rounded-lg overflow-hidden mb-4" style={{ border: "1px solid #E4E1D4", background: "#FCFBF6" }}>
            {specs.map(([label, val], i) => (
              <div key={label} className="flex items-center justify-between px-3 py-2 text-[12px]" style={{ borderTop: i === 0 ? "none" : "1px dashed #E4E1D4" }}>
                <span style={{ color: "#8B8574", fontFamily: "'Space Mono', monospace" }}>{label}</span>
                <span style={{ color: "#1C2321", fontWeight: 500 }}>{val}</span>
              </div>
            ))}
          </div>

          <div className="flex items-center gap-3 rounded-lg p-3 mb-4" style={{ background: "#FCFBF6", border: "1px solid #E4E1D4" }}>
            <div className="w-10 h-10 rounded-full flex items-center justify-center text-white text-sm" style={{ background: "#16321F", fontFamily: "'Fraunces', serif" }}>{listing.seller[0]}</div>
            <div className="flex-1">
              <div className="text-[13px] font-medium flex items-center gap-1" style={{ color: "#1C2321" }}>
                {listing.seller}
                {listing.verified && <ShieldCheck size={13} color="#2F6B44" />}
              </div>
              <div className="flex items-center gap-1 text-[11px]" style={{ color: "#8B8574" }}>
                <Star size={11} fill="#B58A3F" color="#B58A3F" />
                {listing.rating} · {listing.zone}
              </div>
            </div>
            <ChevronRight size={16} color="#8B8574" />
          </div>
        </div>
      </div>
      <div className="p-3" style={{ background: "#FCFBF6", borderTop: "1px solid #E4E1D4" }}>
        <button className="w-full py-3 rounded-full text-white text-sm flex items-center justify-center gap-2" style={{ background: "#B23A24", fontFamily: "'Space Mono', monospace" }}>
          <MessageCircle size={15} />
          Escribir al vendedor
        </button>
      </div>
    </>
  );
}

function PublicarScreen() {
  const fields = [
    { label: "Marca", placeholder: "Ej: Callaway" },
    { label: "Modelo", placeholder: "Ej: Rogue ST Max" },
    { label: "Precio", placeholder: "$" },
    { label: "Zona", placeholder: "Ej: San Isidro, BA" },
  ];
  return (
    <>
      <TopBar title="Publicar palo" />
      <div className="flex-1 overflow-y-auto px-4 py-4" style={{ background: "#F5F6EF" }}>
        <button className="w-full h-32 rounded-lg flex flex-col items-center justify-center gap-1.5 mb-4" style={{ background: "#FCFBF6", border: "1.5px dashed #CFCBB8" }}>
          <Camera size={22} color="#8B8574" />
          <span className="text-[12px]" style={{ color: "#8B8574", fontFamily: "'Space Mono', monospace" }}>Agregar fotos</span>
        </button>
        {fields.map((f) => (
          <div key={f.label} className="mb-3">
            <label className="text-[10px] uppercase tracking-wide block mb-1" style={{ color: "#8B8574", fontFamily: "'Space Mono', monospace" }}>{f.label}</label>
            <input placeholder={f.placeholder} className="w-full px-3 py-2.5 rounded-lg text-sm outline-none" style={{ background: "#FCFBF6", border: "1px solid #E4E1D4", color: "#1C2321" }} readOnly />
          </div>
        ))}
        <div className="mb-3">
          <label className="text-[10px] uppercase tracking-wide block mb-1" style={{ color: "#8B8574", fontFamily: "'Space Mono', monospace" }}>Tipo de palo</label>
          <div className="flex flex-wrap gap-2">
            {["Driver", "Madera", "Híbrido", "Hierro", "Wedge", "Putter"].map((t, i) => (
              <span key={t} className="px-3 py-1.5 rounded-full text-xs" style={{ fontFamily: "'Space Mono', monospace", background: i === 0 ? "#16321F" : "#FCFBF6", color: i === 0 ? "#F5F6EF" : "#454A40", border: "1px solid " + (i === 0 ? "#16321F" : "#E4E1D4") }}>{t}</span>
            ))}
          </div>
        </div>
        <div className="grid grid-cols-2 gap-3 mb-4">
          <div>
            <label className="text-[10px] uppercase tracking-wide block mb-1" style={{ color: "#8B8574", fontFamily: "'Space Mono', monospace" }}>Mano</label>
            <div className="px-3 py-2.5 rounded-lg text-sm" style={{ background: "#FCFBF6", border: "1px solid #E4E1D4", color: "#1C2321" }}>Diestro</div>
          </div>
          <div>
            <label className="text-[10px] uppercase tracking-wide block mb-1" style={{ color: "#8B8574", fontFamily: "'Space Mono', monospace" }}>Flex</label>
            <div className="px-3 py-2.5 rounded-lg text-sm" style={{ background: "#FCFBF6", border: "1px solid #E4E1D4", color: "#1C2321" }}>Regular</div>
          </div>
        </div>
      </div>
      <div className="p-3" style={{ background: "#FCFBF6", borderTop: "1px solid #E4E1D4" }}>
        <button className="w-full py-3 rounded-full text-white text-sm" style={{ background: "#16321F", fontFamily: "'Space Mono', monospace" }}>Publicar</button>
      </div>
    </>
  );
}

function ChatsScreen() {
  const chats = [

    <>

              <div style={{ fontFamily: "'Fraunces', serif", fontWeight: 700, fontSize: 18, color: "#16321F" }}>{n}</div>

// ---------------------------------------------------------------------------
// App
// ---------------------------------------------------------------------------
function App() {
  const [tab, setTab] = useState("buscar");
  const [selected, setSelected] = useState(null);

  let screen;
  if (selected) {
    screen = <DetalleScreen listing={selected} onBack={() => setSelected(null)} />;
  } else if (tab === "buscar") {
    screen = <BuscarScreen onOpen={setSelected} />;
  } else if (tab === "publicar") {
    screen = <PublicarScreen />;
  } else if (tab === "chats") {
    screen = <ChatsScreen />;
  } else {
    screen = <PerfilScreen />;
  }

  return (
    <div className="min-h-screen w-full flex items-center justify-center py-8" style={{ background: "#E7E4D6" }}>
      <div className="w-[375px] h-[760px] rounded-[2.2rem] overflow-hidden flex flex-col relative" style={{ background: "#16321F", boxShadow: "0 25px 50px -12px rgba(0,0,0,0.4)", border: "8px solid #16321F" }}>
        <StatusBar />
        <div className="flex-1 flex flex-col overflow-hidden rounded-t-[1.4rem]" style={{ background: "#F5F6EF" }}>
          {screen}
        </div>
        {!selected && <BottomNav tab={tab} setTab={setTab} />}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>

</body>
